<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="404 Page Not Found - Ferrum Gym" />
        <meta name="author" content="Grupo 16" />
        <title>404 Not Found - Ferrum Gym</title>
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
		<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet">
        <link href="/css/styles.css" rel="stylesheet" />
    </head>
    <body>
        {{> fragments/header }}

        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Error 404</h1>
                    <p class="lead fw-normal text-white-50 mb-0">Page Not Found</p>
                </div>
            </div>
        </header>

        <section class="py-5">
            <div class="container px-4 px-lg-5 mt-5 mb-5">
                <div class="row justify-content-center">
                    <div class="col-lg-6 text-center">
                        <i class="bi bi-search display-1 text-muted mb-4 d-block"></i>
                        <h2 class="fw-bolder">Oops! You're lost.</h2>
                        <p class="lead text-muted mb-5">
                            Sorry, we can't find the page you're looking for.
                            It may have been removed or the address might be incorrect.
                        </p>
                        <a class="btn btn-outline-dark btn-lg" href="/">
                            <i class="bi bi-arrow-left me-2"></i>Back to Home Page
                        </a>
                    </div>
                </div>
            </div>
        </section>

        {{> fragments/footer }}

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>        <script src="/js/scripts.js"></script>
        <script src="/js/scripts.js"></script>
    </body>
</html>
